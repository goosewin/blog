packages:
  - '.'

minimumReleaseAge: 20160

# Pinned Vite+ toolchain is newer than the 14-day cooldown. Frozen lockfile
# installs skip this gate; exclude so deliberate bumps are not blocked.
minimumReleaseAgeExclude:
  - vite-plus
  - '@voidzero-dev/*'
  - vitest
  - '@vitest/*'
  - oxlint
  - oxlint-tsgolint
  - oxfmt
  - '@oxlint/*'
  - '@oxfmt/*'
  - '@oxc-project/*'
  # Taken before the 14-day window on 2026-08-16. Drop after 2026-08-27.
  - next
  - '@next/*'
  - '@vercel/og'
  - react-email
  - resend
  - tsx

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  core-js: false

overrides:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vitest: 4.1.10
