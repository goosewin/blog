packages:
  - '.'

minimumReleaseAge: 20160

# Pinned Vite+ toolchain is newer than the 14-day cooldown. Frozen lockfile
# installs skip this gate; exclude so deliberate bumps are not blocked.
minimumReleaseAgeExclude:
  - vite-plus
  - '@voidzero-dev/*'
  - vitest
  - '@vitest/*'
  - oxlint
  - oxlint-tsgolint
  - oxfmt
  - '@oxlint/*'
  - '@oxfmt/*'
  - '@oxc-project/*'
  # Taken before the 14-day window on 2026-08-16. Drop after 2026-08-27.
  - next@16.3.1
  - '@next/env@16.3.1'
  - '@next/swc-darwin-arm64@16.3.1'
  - '@next/swc-darwin-x64@16.3.1'
  - '@next/swc-linux-arm64-gnu@16.3.1'
  - '@next/swc-linux-arm64-musl@16.3.1'
  - '@next/swc-linux-x64-gnu@16.3.1'
  - '@next/swc-linux-x64-musl@16.3.1'
  - '@next/swc-win32-arm64-msvc@16.3.1'
  - '@next/swc-win32-x64-msvc@16.3.1'
  - '@vercel/og@1.0.1'
  - react-email@6.9.2
  - resend@6.20.0
  - tsx@4.23.12

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  core-js: false

overrides:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vitest: 4.1.10
