clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 0

steps:
  critical:
    image: node:24.18.1-bookworm-slim@sha256:a09aabc645e86e81e23dab78e0c0f2eaa233cab4277c7188232181a1a8bd5d39
    environment:
      CI: 'true'
      SITE_URL: https://goose.dev
      NEXT_PUBLIC_BASE_URL: https://goose.dev
      NEXT_TELEMETRY_DISABLED: '1'
    commands:
      - corepack enable
      - corepack prepare pnpm@11.17.0 --activate
      - pnpm install --frozen-lockfile
      - pnpm run lint:package-manager
      - pnpm exec vp check
      - pnpm exec vp test
      - pnpm run build
    when:
      - event: [pull_request, push, manual]

  newsletter:
    image: node:24.18.1-bookworm-slim@sha256:a09aabc645e86e81e23dab78e0c0f2eaa233cab4277c7188232181a1a8bd5d39
    environment:
      SITE_URL:
        from_secret: site_url
      NEWSLETTER_SECRET:
        from_secret: newsletter_secret
      NEWSLETTER_DRY_RUN: 'false'
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends ca-certificates curl git jq
      - corepack enable
      - corepack prepare pnpm@11.17.0 --activate
      - pnpm install --frozen-lockfile
      - pnpm run newsletter
    when:
      - event: push
        branch: main
        path: 'posts/*.mdx'
